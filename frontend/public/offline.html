<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Professor – Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, sans-serif;
      color: #f5f7ff;
      background: radial-gradient(circle at top, #2b3c8a 0%, #0a1027 55%, #060913 100%);
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Du bist gerade offline</h1>
    <p>Bereits besuchte Seiten und Bibliotheken sind weiterhin verfügbar. Sobald du wieder online bist, werden neue Daten automatisch synchronisiert.</p>
  </div>
</body>
</html>
